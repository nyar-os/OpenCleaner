name: check-rust

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  check-rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@v5
      # Reads rust-toolchain.toml so CI cannot drift from the pinned channel.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The domain tests assert Windows path semantics (`C:\Program Files\...`
      # components, drive-letter volumes). They are only meaningful where those
      # paths parse as paths. Portability on the other runners is covered by the
      # clippy, build and native smoke steps above and by the publish workflow's
      # five-platform native matrix.
      - name: cargo test
        if: matrix.os == 'windows-latest'
        run: cargo test --workspace
      - name: build native addon
        run: cargo build -p open-cleaner-napi --release
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          # Staging runs `wae native stage`; Node is only needed for smoke-native.ts. Do not enable the
          # package-manager cache: package.json declares pnpm, but this workflow
          # never installs it (same trap as OpenDebugger check-rust).
          package-manager-cache: false
      - name: stage platform package
        run: npx -y -p @wae/wae@0.0.6 wae native stage
      - name: native smoke
        run: node --experimental-strip-types scripts/smoke-native.ts
